<div class="card bundle-card h-100 shadow-sm">
  {% if bundle.hero_image_url %}
  <img src="{{ bundle.hero_image_url }}" class="card-img-top" alt="{{ bundle.name }}" />
  {% endif %}
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span class="badge badge-soft-primary">{{ bundle.items.count }} prodotti</span>
      <span class="fw-bold text-primary">€ {{ bundle.price_eur }}</span>
    </div>
    <h3 class="h5 card-title">{{ bundle.name }}</h3>
    <p class="card-text flex-grow-1">{{ bundle.short_description }}</p>
    <a class="btn btn-outline-primary mt-3" href="{{ bundle.get_absolute_url }}">Vedi bundle</a>
  </div>
</div>
