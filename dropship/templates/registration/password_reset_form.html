{% extends "base.html" %}
{% block title %}Recupera password - Dropship Bundles{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h1 class="h4 mb-3 text-center">Recupera la password</h1>
        <p class="text-secondary text-center">Inserisci la tua email per ricevere le istruzioni di reset.</p>
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_email">Email</label>
            {{ form.email.as_widget(attrs={'class': 'form-control'}) }}
          </div>
          <button class="btn btn-primary w-100" type="submit">Invia link di reset</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
